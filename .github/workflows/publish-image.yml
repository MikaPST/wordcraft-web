name: Build and publish WordCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official upstream release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docker-compose.yml"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/mikapst/wordcraft-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Resolve official upstream release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const args = { owner: 'storytold', repo: 'wordcraft' };
            const result = requested
              ? await github.rest.repos.getReleaseByTag({ ...args, tag: requested })
              : await github.rest.repos.getLatestRelease(args);
            const release = result.data;
            if (!release.tag_name) throw new Error('No upstream release tag found');
            core.setOutput('tag', release.tag_name);
            core.setOutput('url', release.html_url);
            core.setOutput('body', release.body || '');
            core.setOutput('prerelease', String(release.prerelease));
            core.setOutput('published_at', release.published_at || '');
            core.setOutput('name', release.name || `wordcraft ${release.tag_name}`);

      - name: Check local release
        id: release-check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.TAG });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const forced = process.env.FORCE_REBUILD === 'true' || context.eventName === 'push';
            core.setOutput('skip', String(exists && !forced));

      - name: Checkout upstream WordCraft
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/wordcraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: upstream

      - name: Read pinned craft-i18n revision
        if: steps.release-check.outputs.skip != 'true'
        id: i18n
        shell: bash
        run: |
          set -euo pipefail
          revision="$(tr -d '[:space:]' < upstream/craft-i18n.rev)"
          test -n "$revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned craft-i18n data
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-i18n
          ref: ${{ steps.i18n.outputs.revision }}
          path: craft-i18n

      - name: Record upstream release commit for image tags
        if: steps.release-check.outputs.skip != 'true'
        id: release-source
        shell: bash
        run: |
          echo "short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        if: steps.release-check.outputs.skip != 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build WordCraft Web
        if: steps.release-check.outputs.skip != 'true'
        working-directory: upstream/apps/wordcraft-web
        env:
          CRAFT_I18N_DIR: ${{ github.workspace }}/craft-i18n
          CRAFT_I18N_REQUIRED: "1"
        run: trunk build --release --dist dist/web --public-url ./

      - name: Verify web build output
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s upstream/apps/wordcraft-web/dist/web/index.html
          find upstream/apps/wordcraft-web/dist/web -maxdepth 1 -type f -name 'wordcraft-web-*.js' | grep -q .
          find upstream/apps/wordcraft-web/dist/web -maxdepth 1 -type f -name 'wordcraft-web-*_bg.wasm' | grep -q .
          echo "WordCraft Web build output verified."

      - name: Prepare NGINX image context
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p image-context/site
          cp -a upstream/apps/wordcraft-web/dist/web/. image-context/site/
          cat > image-context/Dockerfile <<'EOF'
          FROM nginx:1.27-alpine
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY site/ /usr/share/nginx/html/
          EXPOSE 8080
          EOF
          cat > image-context/nginx.conf <<'EOF'
          server {
              listen 8080;
              server_name _;
              root /usr/share/nginx/html;
              index index.html;

              include /etc/nginx/mime.types;
              default_type application/octet-stream;

              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              # NGINX includes in gzip_types automatically; do not list it again.
              gzip_types application/javascript text/javascript application/wasm application/json text/css text/plain image/svg+xml;

              location = /index.html {
                  add_header Cache-Control "no-cache";
              }

              location / {
                  try_files $uri $uri/ =404;
              }

              # Avoid regex quantifier braces here: NGINX treats unescaped braces as block syntax.
              # JavaScript and WASM are revalidated so updated builds cannot be hidden by stale browser caches.
              location ~* \.(js|wasm)$ {
                  add_header Cache-Control "no-cache";
                  try_files $uri =404;
              }
          }
          EOF

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: steps.release-check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream-release.outputs.tag }}
            type=raw,value=upstream-${{ steps.release-source.outputs.short }}

      - name: Build and push multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: image-context
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create or update versioned GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.upstream-release.outputs.tag }}
          RELEASE_NAME: ${{ steps.upstream-release.outputs.name }}
          RELEASE_URL: ${{ steps.upstream-release.outputs.url }}
          RELEASE_NOTES: ${{ steps.upstream-release.outputs.body }}
          RELEASE_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          RELEASE_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          RELEASE_SOURCE_SHA: ${{ steps.release-source.outputs.short }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const image = 'ghcr.io/mikapst/wordcraft-web';
            const body = [
              `Community-maintained Docker packaging for **${process.env.RELEASE_NAME}**.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.RELEASE_SOURCE_SHA}\``,
              '',
              'Platforms: `linux/amd64`, `linux/arm64`.',
              '',
              `Official upstream release: ${process.env.RELEASE_URL}`,
              `Published upstream: ${process.env.RELEASE_PUBLISHED_AT || 'not specified'}`,
              '',
              `Upstream source commit: \`${process.env.RELEASE_SOURCE_SHA}\``,
              `Docker manifest digest: \`${process.env.RELEASE_DIGEST || 'not reported'}\``,
              '',
              '## Upstream release notes',
              process.env.RELEASE_NOTES || 'No release notes provided upstream.',
              '',
              'This is an independent Docker packaging release, not an official upstream distribution.'
            ].join('\n');
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id: existing.id, name: 'WordCraft Web ' + tag,
                body, draft: false, prerelease: process.env.RELEASE_PRERELEASE === 'true'
              });
            } else {
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: 'WordCraft Web ' + tag, body, draft: false, prerelease: process.env.RELEASE_PRERELEASE === 'true'
              });
            }
